name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  data:
    name: Данные словаря
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Валидация words-part*.json
        run: node ./tests/validate-data.mjs

  app:
    name: Сборка и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Тесты (данные + интерфейс)
        run: npm test
      - name: Пересборка артефактов
        run: npm run build
      - name: Артефакты актуальны
        run: |
          git diff --exit-code -- styles.css romanian-daily-offline.html \
            || { echo "Артефакты устарели — выполните npm run build"; exit 1; }
