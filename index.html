<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RO Daily">
<title>Romanian Daily</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#f4efe6;color:#1c1916}
.box{text-align:center;padding:24px}
.spin{width:28px;height:28px;border:3px solid #ddd;border-top-color:#2f5d50;border-radius:50%;margin:0 auto 12px;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box"><div class="spin"></div><div>Загружаю Romanian Daily…</div></div>
<script>
(async function(){
  try{
    const parts=await Promise.all([1,2,3].map(i=>fetch('./app.b64.'+i+'.txt',{cache:'reload'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()})));
    const bin=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));
    const html=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<div class="box">Не удалось открыть приложение.<br><small>'+e+'</small></div>';
  }
})();
</script>
</body>
</html>
